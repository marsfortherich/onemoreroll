name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# never let two deploys race; always finish the newest
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    name: Tests and balance smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # the logic layer runs headlessly, so CI can gate the deploy on it
      - name: Unit and content tests
        run: node tools/test.js
      - name: Balance smoke (every run must terminate cleanly)
        run: node tools/sim.js --runs 60

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        # turns Pages on for the repo on the first run, so no settings
        # click is needed before the first deploy
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# never let two deploys race; always finish the newest
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    name: Tests and balance smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # the logic layer runs headlessly, so CI can gate the deploy on it
      - name: Unit and content tests
        run: node tools/test.js
      - name: Balance smoke (every run must terminate cleanly)
        run: node tools/sim.js --runs 60

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # NOTE: Pages must already be switched on for this repo, under
      # Settings -> Pages -> Source: GitHub Actions. `enablement: true`
      # does not work here: creating a Pages site needs repo-admin scope,
      # which the default GITHUB_TOKEN does not have, and it fails with
      # "Resource not accessible by integration".

      - name: Verify the shared/ copy is intact
        run: |
          test -f shared/MANIFEST || {
            echo "::error::shared/MANIFEST is missing -- run tools/sync-shared.py in the arcade and commit"; exit 1; }
          ( cd shared && sha256sum -c --quiet MANIFEST ) || {
            echo "::error::shared/ does not match its manifest. Either a file here was edited directly (edit the arcade's /shared instead) or a sync was interrupted. Re-run tools/sync-shared.py and commit."; exit 1; }
          # sha256sum -c cannot see a file the manifest does not list, so count too.
          listed=$(grep -cv '^#' shared/MANIFEST)
          present=$(find shared -type f ! -name MANIFEST | wc -l)
          if [ "$listed" -ne "$present" ]; then
            echo "::error::shared/ holds $present files but MANIFEST lists $listed -- a leftover from an old sync. Re-run tools/sync-shared.py (it prunes) and commit."
            find shared -type f ! -name MANIFEST | LC_ALL=C sort
            exit 1
          fi
          echo "shared/: $present files, all matching MANIFEST"
          # NOTE: this proves the copy is complete and unmodified, NOT that it is
          # current -- the manifest travels with the files, so an old copy carries an
          # old manifest and agrees with itself. Only `python tools/sync-shared.py
          # --check`, run at the arcade root, can answer that.

      - name: Fail if cached assets changed without a version bump
        run: python3 shared/tools/asset-digest.py --stamp index.html js css shared

      - name: Check the published root is intact
        run: |
          test -f index.html || { echo "::error::index.html is missing"; exit 1; }
          test -f CNAME || { echo "::error::CNAME is missing — the custom domain would be dropped"; exit 1; }
          test -f shared/js/arcade.js || {
            echo "::error::shared/ is missing — run tools/sync-shared.py in the arcade and commit"; exit 1; }

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
